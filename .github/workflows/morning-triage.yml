name: Morning Triage Loop

on:
  schedule:
    # Runs at 6:00 AM UTC every day. Adjust as needed.
    - cron: '0 6 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Morning Triage via Antigravity
        env:
          # Your agent needs its API key to think
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Needed if the triage skill queries GitHub issues
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install the Antigravity CLI
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          
          # Run the Antigravity CLI non-interactively, instructing it to trigger the skill
          agy --print "Run the morning-triage skill and update the state/progress.md file. Create a PR with your findings." --dangerously-skip-permissions
